name: Update OpenStack contribution card

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update CA certificates
        run: |
          sudo apt-get update
          sudo apt-get install --reinstall -y ca-certificates
          sudo update-ca-certificates

      - name: Test Stackalytics
        run: |
          curl -v --fail \
            "https://www.stackalytics.io/api/1.0/stats/modules?release=all&metric=person-day&project_type=openstack&user_id=sakumbha"

      - name: Generate card
        env:
          STACKALYTICS_USER: sakumbha
        run: python3 generate_card.py

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card.svg
          git diff --cached --quiet || git commit -m "chore: update OpenStack contribution card"
          git push
